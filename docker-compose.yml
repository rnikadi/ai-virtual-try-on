services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tryon
      POSTGRES_PASSWORD: tryon
      POSTGRES_DB: tryon
    ports:
      - "5432:5432"
    volumes:
      - tryon-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tryon"]
      interval: 5s
      retries: 10

volumes:
  tryon-db:
